name: Test

on:
  push:
    branches:
      - "main"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Pin git dependencies
        run: |
          opam pin add mcp_protocol https://github.com/jeong-sik/mcp-protocol-sdk.git#main -n -y
          opam pin add mcp_protocol_eio https://github.com/jeong-sik/mcp-protocol-sdk.git#main -n -y
          opam pin add mcp_protocol_http https://github.com/jeong-sik/mcp-protocol-sdk.git#main -n -y

      - name: Install dependencies
        run: |
          opam install . --deps-only --with-test -y

      - name: v2 smoke tests
        run: |
          set -euo pipefail
          timeout 60 opam exec -- dune exec -- test/test_v2_surface.exe
          timeout 60 opam exec -- dune exec -- test/test_v2_metadata.exe
          timeout 60 opam exec -- dune exec -- test/test_v2_resources.exe

      - name: OCaml tests
        run: opam exec -- dune test --no-buffer -j 1

      - name: Python tests (optional)
        if: ${{ hashFiles('scripts/test_*.py') != '' }}
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
