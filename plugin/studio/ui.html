<!doctype html>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui; margin: 20px; color: #202124; }
  h1 { font-size: 19px; margin-bottom: 8px; }
  label { display: block; margin-top: 18px; }
  input { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; }
  button { margin: 16px 6px 8px 0; padding: 9px 14px; }
  #status { white-space: pre-wrap; line-height: 1.5; }
  .hint { color: #60646c; line-height: 1.5; }
</style>
<h1>Figma Studio</h1>
<p class="hint">Keep this Plugin open while MASC captures or edits this file.</p>
<label>Local relay <input id="url" value="http://127.0.0.1:8941" spellcheck="false"></label>
<label>Pairing token <input id="token" type="password" autocomplete="off"></label>
<button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button>
<p id="document"></p><p id="status">Waiting for Figma…</p>
<script>
  'use strict';
  let context, connection, pending, active = false, connecting = false;
  const status = value => { document.getElementById('status').textContent = value; };
  const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  async function request(path, body) {
    const response = await fetch(connection.url + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${connection.token}` },
      body: JSON.stringify(body)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || `Relay returned ${response.status}`);
    return result;
  }
  function send(command) {
    return new Promise(resolve => {
      pending = { command, resolve };
      parent.postMessage({ pluginMessage: { type: 'command', session_id: context.session_id, command } }, '*');
    });
  }
  function resultWire(sessionId, operationId, result, maxBytes) {
    if (!Number.isSafeInteger(maxBytes) || maxBytes <= 0) throw new Error('Invalid relay envelope limit');
    const wire = { session_id: sessionId, operation_id: operationId, ...result };
    const fits = value => new TextEncoder().encode(JSON.stringify(value)).length <= maxBytes;
    if (fits(wire)) return wire;
    const completed = result.payload && Array.isArray(result.payload.completed) ? result.payload.completed : [];
    const identities = completed.map((entry, index) => ({ index,
      ...(entry && typeof entry.op === 'string' ? { op: entry.op } : {}),
      ...(entry && typeof entry.node_id === 'string' ? { node_id: entry.node_id } : {}) }));
    const summary = count => ({ session_id: sessionId, operation_id: operationId, ok: false,
      payload: { status: 'outcome_unknown', error: 'Readback exceeds relay envelope; inspect the document',
        completed_count: completed.length, completed: identities.slice(0, count),
        completed_omitted: completed.length - count, details_omitted: true } });
    if (!fits(summary(0))) throw new Error('Relay envelope cannot hold the operation receipt');
    let low = 0, high = identities.length;
    while (low < high) {
      const count = Math.ceil((low + high) / 2);
      if (fits(summary(count))) low = count;
      else high = count - 1;
    }
    return summary(low);
  }
  async function run() {
    while (active) {
      try {
        if (pending && pending.result) {
          const wire = resultWire(context.session_id, pending.command.id, pending.result, connection.maxBytes);
          await request('/result', wire);
          pending = undefined;
          status('Result retained by MASC. Ready.');
        }
        const reply = await request('/poll', { session_id: context.session_id });
        if (reply.command) {
          status(`Running ${reply.command.kind}…`);
          await send(reply.command);
        } else await sleep(connection.pollInterval);
      } catch (error) {
        status(`${error.message}\nReconnect to continue. An uncertain edit will not be replayed.`);
        active = false;
      }
    }
    document.getElementById('connect').disabled = false;
    document.getElementById('disconnect').disabled = true;
  }
  onmessage = event => {
    if (event.source !== parent) return;
    const message = event.data.pluginMessage;
    if (!message) return;
    if (message.type === 'context') {
      context = message;
      document.getElementById('document').textContent = `${message.name} · ${message.selection.length} selected`;
      if (!active) status('Select a frame and connect to MASC.');
    } else if (message.type === 'result' && pending && message.id === pending.command.id && message.session_id === context.session_id) {
      pending.result = { ok: message.ok, payload: message.payload };
      pending.resolve();
    }
  };
  document.getElementById('connect').onclick = async () => {
    if (connecting || active) return;
    connecting = true;
    document.getElementById('connect').disabled = true;
    try {
      if (!context) throw new Error('Figma context is not ready');
      const url = new URL(document.getElementById('url').value);
      if (url.origin !== 'http://127.0.0.1:8941' || url.pathname !== '/') throw new Error('Use the declared local relay origin');
      connection = { url: url.origin, token: document.getElementById('token').value };
      const { type, session_id, ...documentContext } = context;
      const reply = await request('/session', { session_id, document: documentContext });
      connection.maxBytes = reply.max_request_bytes;
      connection.pollInterval = reply.poll_interval_ms;
      active = true;
      document.getElementById('connect').disabled = true;
      document.getElementById('disconnect').disabled = false;
      status('Connected. Choose this session in MASC.');
      await run();
    } catch (error) { status(error.message); }
    finally {
      connecting = false;
      document.getElementById('connect').disabled = active;
    }
  };
  document.getElementById('disconnect').onclick = () => { active = false; status('Disconnecting after the current operation…'); };
</script>
